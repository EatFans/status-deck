; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = boards
default_envs = esp32-s3-n16r8

; Status Deck 固定使用 ESP32-S3 N16R8：16MB Flash + 8MB Octal PSRAM。
; 执行 `pio run -t upload` 会直接构建并烧录这个目标。
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.3
  bblanchon/ArduinoJson@^6.21.5
  adafruit/Adafruit GFX Library@^1.12.3
  adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
build_flags =
  ; 2.8 英寸 ST7789 SPI 屏。N16R8 的 GPIO26-32 被板载 Flash/PSRAM 使用，
  ; 因此只选开发板排针上可用的 GPIO4-7、17、18；GPIO19/20 留给原生 USB。
  -D STATUS_DECK_DISPLAY_CS=5
  -D STATUS_DECK_DISPLAY_DC=6
  -D STATUS_DECK_DISPLAY_RESET=7
  -D STATUS_DECK_DISPLAY_BACKLIGHT=4
  -D STATUS_DECK_DISPLAY_SCK=18
  -D STATUS_DECK_DISPLAY_MOSI=17
  -D STATUS_DECK_DISPLAY_SPI_FREQUENCY=40000000
  -D STATUS_DECK_ACTIVITY_LED_PIN=2
