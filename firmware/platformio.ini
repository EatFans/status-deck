; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; 当前默认使用手上的经典 ESP32 测试板。执行 `pio run -t upload` 会上传到它。
[platformio]
default_envs = esp32vn-iot-uno

[env:esp32vn-iot-uno]
platform = espressif32
board = esp32vn-iot-uno
framework = arduino
monitor_speed = 115200
; 经典 ESP32 测试板的 USB 串口在 921600 下可能出现数据损坏。
; 先以 115200 保证烧录稳定；后续确认稳定后再逐步提高。
upload_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.3

; 当前接入的是 ESP32vn IoT Uno（经典 ESP32，4MB Flash，无 PSRAM）。
; 之前的 ESP32-S3 N16R8 参数不能用于这块板，否则 esptool 会拒绝上传。

; 后续换到 ESP32-S3 N16R8 时，使用：
;   pio run -e esp32-s3-n16r8 -t upload
; 两个环境共用 src/ 与 include/ 中的 BLE 代码；仅编译参数不同。
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.3

; ESP32-S3 N16R8：16MB Flash + 8MB Octal PSRAM。
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  -D BOARD_HAS_PSRAM
